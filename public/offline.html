<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اینترنت قطع شده 🤍 | آروم شو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    :root {
      --color-bg: #FDFBF7;
      --color-primary: #7C3AED;
      --color-primary-hover: #6D28D9;
      --color-text: #1F2937;
      --color-text-muted: #4B5563;
      --color-card-bg: #FFFFFF;
      --color-card-border: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }

    .card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .icon-container {
      margin-bottom: 1.5rem;
      font-size: 4rem;
      line-height: 1;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    button {
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--color-primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">🤍</div>
    <h1>اینترنت قطع شده</h1>
    <p>برای تحلیل دعوا، دریافت پیام‌های هوشمند و استفاده از قابلیت‌های هوش مصنوعی آروم شو، باید دوباره به اینترنت وصل بشی.</p>
    <button onclick="window.location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
